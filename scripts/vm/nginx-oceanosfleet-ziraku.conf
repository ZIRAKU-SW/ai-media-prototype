# oceanosfleet.com（35.192.37.133）の nginx に追加するスニペット
# /Ziraku → GCP VM の Next.js（basePath=/Ziraku）
#
# 1. TUNNEL_URL を更新: cat ~/ai-media-prototype/run/dev-console-tunnel-url.txt
# 2. 下記の __TUNNEL_URL__ を置換して /etc/nginx/conf.d/ 等に include
# 3. sudo nginx -t && sudo systemctl reload nginx

location = /Ziraku {
    return 301 /Ziraku/;
}

location /Ziraku/ {
    proxy_pass __TUNNEL_URL__/Ziraku/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host __TUNNEL_HOST__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 20m;
}
